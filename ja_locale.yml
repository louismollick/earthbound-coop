# Japanese Locale (docs/adr/0003-japanese-locale.md): what `ebtools extract-ja`
# needs beyond mother2.yml. Offsets and facts about the ROM only, no ROM bytes.

# The donor ROM: unheadered Mother 2 (Japan).
romSha1: 8738cff9e38a8b86ae30bfe0e5fbcb2828c2b16e

# Mother 2 textTable entries added or corrected after reading the glyphs
# (JP/graphics/text_window.gfx, two 8x8 tiles per code).
textTable:
  0x23: $
  0x24: ¤   # two small zeros over a bar, next to the ATM number selector
  0x26: ～
  0x27: ／  # 0x2F ('/' in mother2.yml) is a blank spacer glyph in the keyboard
  0x5E: .   # low dot: G.H. Pikaal
  0x5F: 。  # mother2.yml has '.', the glyph is the full stop circle
  0xEE: ヲ

# US label -> Mother 2 label, for pairs that neither the same name nor the
# reference propagation finds (the same message under a placeholder name).
labels:
  MSG_DBGTXT_EMPTY_STUB: TEXT_UNKNOWN_5_000000
  MSG_DOOR_TONZURABUS_HOTSPOT: TEXT_UNKNOWN_4_0083E9
  MSG_DOOR_SHACK_KEY_CHECK: TEXT_UNKNOWN_4_0085A8
  MSG_DOOR_LOCKED: TEXT_UNKNOWN_4_0085EC
  MSG_DOOR_EMPTY_611: TEXT_UNKNOWN_4_008604
  MSG_DOOR_BAD_KEY_MACHINE_USE: TEXT_UNKNOWN_4_008605
  MSG_DOOR_CHAOS_NOISE_COMPLAINT: TEXT_UNKNOWN_4_008ADE
  MSG_DOOR_STAIRS_FALL: TEXT_UNKNOWN_4_008B5E
  MSG_DOOR_EMPTY_12B6: TEXT_UNKNOWN_4_0090B2
  MSG_DOOR_EMPTY_OPEN_CLOSE: TEXT_UNKNOWN_4_0095EA
  MSG_UNK_JEFF_RESCUE_SKY_RUNNER_TRIP: TEXT_UNKNOWN_4_00DCB0

# Mother 2 data for the Japanese interface (ebtools/ja_interface.py): file
# offsets into mother2.sfc (the symbols' addresses in build/mother2.map, minus
# 0xC00000) and sizes. `count` entries of `size` bytes each.
rom:
  # FILE_SELECT_TEXT_PLEASE_NAME_THEM_STRINGS: the naming prompts (NAME_THEM_STRING_LENGTH 15)
  namingPrompts: {offset: 0x049525, size: 15, count: 7}
  # FILE_SELECT_TEXT_FAVORITE_FOOD .. _ARE_YOU_SURE_NOPE: the naming confirmation
  favoriteFood: {offset: 0x04958E, size: 9}
  coolestThing: {offset: 0x049597, size: 11}
  areYouSure: {offset: 0x0495A2, size: 12}
  areYouSureYep: {offset: 0x0495AE, size: 3}
  areYouSureNope: {offset: 0x0495B1, size: 4}
  # DONT_CARE_NAMES: 7 groups (Ness .. favourite thing) of 7 names
  dontCareNames: {offset: 0x15F42F, size: 6, count: 49}
  # NAME_REGISTRY_REQUEST_STRING (ENTER_YOUR_NAME_PLEASE)
  nameRegistryRequest: {offset: 0x03F670, size: 11}
  # CONSONANT_VOWEL_TRANSLITERATION_PAIRS (PROCESS_NAME_INPUT_STRING): 26 letters x 5 vowels x 2 codes
  transliterationPairs: {offset: 0x03F67B, size: 260}
  # MRSATURN_CHAR_TILE_MAP (text code - 16 -> Mr. Saturn glyph + 1, 0 = the normal tile)
  # and MRSATURN_CHAR_WIDTH_TABLE (PRINT_MRSATURN_LETTER)
  mrSaturnCharMap: {offset: 0x03EAED, size: 240}
  mrSaturnWidths: {offset: 0x03EBDD, size: 62}
  # MRSATURN_FONT_DATA: 16x16 glyphs, 2bpp tiles, 8 glyphs per 16-tile row (JP/fonts/unknown.gfx)
  mrSaturnFont: {offset: 0x20209D, size: 4096}
  # MOTHER2_ROMAJI_FONT: the 8x8 window title glyphs, codes 0x20-0xFF (JP/fonts/hppp.gfx)
  titleFont: {offset: 0x20110E, size: 3584}
